name: Release automation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-automation
  cancel-in-progress: false
jobs:
  release:
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    uses: jellysin/plugin-tooling/.github/workflows/release-please.yml@24d91a995375f230fe943dff87cf4e4c49a0987f # v1.0.2
    with:
      publish: false
